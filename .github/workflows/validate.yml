name: Validate authored checkpoint
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_environment.py
      - run: python scripts/validate_curriculum.py
      - run: python scripts/validate_links.py
      - run: python scripts/validate_exercises.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q forgeagent scripts labs solutions tests
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.9
      - run: uv sync --locked --extra schemas
      - run: uv run --locked --extra schemas python -m unittest tests.integration.test_llm_app.SchemaComparisonTests -v
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.9
      - run: uv sync --locked --extra schemas --extra service
      - run: uv run --locked --extra schemas --extra service python -m unittest discover -s tests -q
