services:
  forgeagent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FORGEAGENT_TOKEN: ${FORGEAGENT_TOKEN:?Set a disposable token}
      FORGEAGENT_OWNER: ${FORGEAGENT_OWNER:?Set an owner ID}
      FORGEAGENT_DATABASE: /data/jobs.sqlite3
    volumes:
      - agent-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  agent-data:
